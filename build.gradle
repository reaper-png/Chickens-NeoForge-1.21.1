plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = project.mod_version
group = 'net.creeperhost.chickens'
base { archivesName = project.mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = project.neoforge_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Real JUnit tests: Gradle previously discovered a main() smoke check but
// no test framework/annotated test methods.
repositories {
    maven { url = uri('https://maven.blamejared.com') }
    maven { url = uri('https://api.modrinth.com/maven') }
}

dependencies {
    // Optional: JEI discovers the plugin only when JEI is installed.
    // The API is not bundled with the Chickens mod JAR.
    compileOnly 'mezz.jei:jei-1.21.1-common-api:19.57.0.447'
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.57.0.447'
    // Jade is optional and not bundled inside Chickens.
    compileOnly 'maven.modrinth:jade:15.10.6+neoforge'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// Keep the version displayed by NeoForge in sync with the Gradle artifact.
tasks.named('processResources', ProcessResources) {
    inputs.property('mod_version', project.mod_version)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(mod_version: project.mod_version)
    }
}


// A successful Java compile does not guarantee the published JAR is loadable.
// Verify the exact version in the archive's NeoForge metadata on every build.
tasks.register('verifyPackagedModVersion') {
    dependsOn tasks.named('jar')
    doLast {
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            def entry = zip.getEntry('META-INF/neoforge.mods.toml')
            if (entry == null) {
                throw new GradleException('Missing NeoForge metadata in ' + jarFile.name)
            }
            def metadata = zip.getInputStream(entry).withCloseable { stream ->
                stream.getText('UTF-8')
            }
            def expected = 'version="' + project.mod_version + '"'
            if (!metadata.readLines().any { it.trim() == expected }) {
                throw new GradleException('Packaged NeoForge version differs from mod_version='
                        + project.mod_version + ' in ' + jarFile.name)
            }
        }
    }
}

tasks.named('build') {
    dependsOn tasks.named('verifyPackagedModVersion')
}


// Catch broken release artifacts, not just missing source resources: 46 chicken
// skins and corresponding loot tables plus the eight machine block drops
// must actually be present inside the published JAR.
tasks.register('verifyPackagedChickensAssets') {
    dependsOn tasks.named('jar')
    doLast {
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        def entityLootDir = file('src/main/resources/data/chickens/loot_table/entities')
        def entityLootFiles = fileTree(entityLootDir).matching { include '*.json' }.files
        if (entityLootFiles.size() != 46) {
            throw new GradleException('Expected 46 original chicken loot tables, found '
                    + entityLootFiles.size())
        }
        def blocks = ['breeder', 'roost', 'henhouse', 'henhouse_acacia',
                      'henhouse_birch', 'henhouse_dark_oak', 'henhouse_jungle', 'henhouse_spruce']
        def required = new LinkedHashSet<String>()
        required.add('META-INF/neoforge.mods.toml')
        entityLootFiles.each { loot ->
            def species = loot.name.substring(0, loot.name.length() - '.json'.length())
            required.add("data/chickens/loot_table/entities/${loot.name}")
            required.add("assets/chickens/textures/entity/${species}.png")
        }
        blocks.each { block ->
            required.add("data/chickens/loot_table/blocks/${block}.json")
            required.add("assets/chickens/blockstates/${block}.json")
        }
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            def missing = required.findAll { name -> zip.getEntry(name) == null }
            if (!missing.isEmpty()) {
                throw new GradleException('Missing resources inside ' + jarFile.name
                        + ': ' + missing.join(', '))
            }
        }
    }
}

tasks.named('build') {
    dependsOn tasks.named('verifyPackagedChickensAssets')
}

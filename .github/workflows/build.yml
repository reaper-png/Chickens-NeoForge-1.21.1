name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Java 21 / NeoForge 1.21.1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # This repository intentionally does not track a Gradle Wrapper.
      # Use the same Gradle 9.2.1 version previously used in development.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Compile, run JUnit tests and verify packaged mod assets
        run: gradle --no-daemon clean build

      # Keep a downloadable candidate JAR for review without publishing a release.
      - name: Upload verified candidate JAR
        uses: actions/upload-artifact@v4
        with:
          name: chickens-neoforge-1.21.1-candidate
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
